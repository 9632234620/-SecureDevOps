 name: SecureDevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # TEST JOB
  # ============================================================

  test:
    name: Application Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: ./app
        run: |
          python -m py_compile app.py

  # ============================================================
  # SECURITY SCAN
  # ============================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit security scan
        working-directory: ./app
        run: |
          bandit -r . -x ./templates

      - name: Check dependencies for vulnerabilities
        working-directory: ./app
        run: |
          pip-audit

  # ============================================================
  # DOCKER BUILD
  # ============================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test
      - security

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t securedevops-app ./app

      - name: Verify Docker image
        run: |
          docker images securedevops-app

  # ============================================================
  # CI/CD SUCCESS
  # ============================================================

  pipeline-success:
    name: CI/CD Pipeline Success
    runs-on: ubuntu-latest
    needs:
      - test
      - security
      - docker

    steps:

      - name: Pipeline completed successfully
        run: |
          echo "======================================"
          echo " SecureDevOps CI/CD Pipeline"
          echo "======================================"
          echo "Tests: PASSED"
          echo "Security Scan: PASSED"
          echo "Docker Build: PASSED"
          echo "======================================"