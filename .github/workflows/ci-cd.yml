name: SecureDevOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m py_compile app/app.py

      - name: Run Application Test
        run: |
          cd app
          python -c "import py_compile; py_compile.compile('app.py', doraise=True); print('Application syntax test passed')"


  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t securedevops-app ./app


  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          ignore-unfixed: true


  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Status
        run: |
          echo "SecureDevOps deployment completed successfully"
          echo "Application: SecureDevOps"
          echo "Environment: Production"
          echo "Status: SUCCESS"