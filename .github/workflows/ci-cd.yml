name: SecureDevOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Check Python Syntax
        run: |
          python -m py_compile app/app.py

      - name: Run Application Test
        run: |
          cd app
          python -c "import app; print('Application imported successfully')"


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t securedevops-app ./app

      - name: Verify Docker Image
        run: |
          docker images securedevops-app


  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Started
        run: |
          echo "Starting SecureDevOps deployment..."

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Deployment Successful
        run: |
          echo "SecureDevOps deployment completed successfully."